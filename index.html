<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PANE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --income-color: #00ff88;
        --expense-color: #ff4757;
        --cyan: #00f2ff;
        --purple: #9d00ff;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        background-color: #050508;
        color: #ffffff;
        font-family: 'JetBrains Mono', monospace;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        position: relative;
    }

    .grid-bg {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        background-image: 
            radial-gradient(circle at 20% 80%, rgba(157, 0, 255, 0.03) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(0, 242, 255, 0.03) 0%, transparent 50%),
            linear-gradient(rgba(157, 0, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(157, 0, 255, 0.05) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
    }

    .main-header {
        position: fixed; top: 0; left: 0; width: 100%; height: 70px;
        padding: 0 clamp(15px, 3vw, 40px);
        display: flex; align-items: center; justify-content: center;
        z-index: 100; background: rgba(5, 5, 12, 0.85);
        backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .page-title {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(22px, 4vw, 32px); font-weight: 900;
        letter-spacing: clamp(4px, 1.5vw, 12px);
        text-transform: uppercase; text-align: center;
        display: flex; align-items: center; justify-content: center;
    }
    
    .page-title .letter-p { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.6); }
    .page-title .letter-a { color: #0055ff; text-shadow: 0 0 10px rgba(0, 85, 255, 0.6); }
    .page-title .letter-n { color: #00f2ff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.6); }
    .page-title .letter-e { color: #ff2a2a; text-shadow: 0 0 10px rgba(255, 42, 42, 0.6); }

    .main-layout {
        display: grid; grid-template-columns: 280px 1fr;
        height: calc(100vh - 70px); height: calc(100dvh - 70px);
        margin-top: 70px; padding: 20px; gap: 20px; overflow: hidden;
    }

    .sidebar {
        background: rgba(10, 10, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; backdrop-filter: blur(20px); padding: 20px;
        display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 0;
    }

    .sidebar-buttons-container {
        display: flex; flex-direction: column; gap: 12px; width: 100%; flex: 1;
        overflow-y: auto; overflow-x: hidden; padding-right: 2px; min-height: 0;
    }

    .sidebar-btn {
        display: flex; align-items: center; gap: 15px; padding: 14px 18px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
        color: #ffffff; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 1.5px; cursor: pointer;
        transition: all 0.3s ease; text-transform: uppercase; width: 100%; text-align: left; flex-shrink: 0;
    }

    .sidebar-btn i { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
    .sidebar-btn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-btn:hover { transform: translateX(5px); box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); }

    .btn-analysis { border-left: 3px solid var(--cyan); color: var(--cyan); }
    .btn-transaction { border-left: 3px solid var(--cyan); color: var(--cyan); }
    .btn-import { border-left: 3px solid var(--income-color); color: var(--income-color); }
    .btn-export { border-left: 3px solid var(--expense-color); color: var(--expense-color); }
    .btn-months { border-left: 3px solid var(--purple); color: var(--purple); margin-top: auto; }

    .sidebar-widget {
        background: rgba(10, 10, 20, 0.9); border: 1px solid rgba(0, 242, 255, 0.3);
        border-radius: 8px; padding: 15px; margin-top: 20px; position: relative; overflow: hidden;
        backdrop-filter: blur(10px); transition: all 0.4s ease; flex-shrink: 0; z-index: 10;
    }

    .widget-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cyber-amount { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 8px rgba(0, 242, 255, 0.8); }
    .cyber-amount.negative { color: var(--purple); text-shadow: 0 0 8px rgba(157, 0, 255, 0.8); }

    .dashboard { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; min-width: 0; }

    .dashboard-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; flex-shrink: 0; }

    .stat-card {
        background: rgba(10, 10, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; padding: 15px; position: relative; overflow: hidden; transition: all 0.3s ease;
        display: flex; align-items: center; gap: 10px; cursor: pointer;
    }

    .stat-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.3); }
    .card-accent { position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
    
    .piraeus-accent { background: #ffcc00; }
    .piraeus-card .card-title, .piraeus-card .card-value { color: #ffcc00; }
    .alpha-accent { background: #0055ff; }
    .alpha-card .card-title, .alpha-card .card-value { color: #0055ff; }
    .nbg-accent { background: var(--cyan); }
    .nbg-card .card-title, .nbg-card .card-value { color: var(--cyan); }
    .eurobank-accent { background: #ff2a2a; }
    .eurobank-card .card-title, .eurobank-card .card-value { color: #ff2a2a; }

    .card-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-icon svg { width: 22px; height: 22px; }
    .card-content { padding-left: 5px; flex: 1; min-width: 0; }
    .card-title { font-family: 'Orbitron', sans-serif; font-size: 10px; margin-bottom: 6px; }
    .card-value { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; }

    .transactions-section {
        background: rgba(10, 10, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0;
    }

    .transactions-header { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .transactions-header h3 { font-family: 'Orbitron', sans-serif; font-size: 13px; color: #ffffff; }
    .transactions-table { padding: 10px 15px; overflow-y: auto; flex: 1; }
    .transactions-table table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .transactions-table th { text-align: left; padding: 10px 8px; font-family: 'Orbitron', sans-serif; font-size: 10px; color: rgba(255, 255, 255, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .transactions-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .transactions-table th:nth-child(1) { width: 20%; }
    .transactions-table th:nth-child(2) { width: 45%; }
    .transactions-table th:nth-child(3) { width: 22%; }
    .transactions-table th:nth-child(4) { width: 13%; }

    .action-buttons { display: flex; gap: 4px; justify-content: flex-end; }
    .action-btn { width: 28px; height: 28px; border-radius: 6px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .edit-btn { background: rgba(0, 242, 255, 0.1); color: var(--cyan); border: 1px solid rgba(0, 242, 255, 0.3); }
    .delete-btn { background: rgba(255, 71, 87, 0.1); color: var(--expense-color); border: 1px solid rgba(255, 71, 87, 0.3); }

    /* MODALS & PANELS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
    .modal-content { background: rgba(10, 10, 20, 0.95); border: 2px solid rgba(0, 242, 255, 0.3); border-radius: 16px; width: 100%; max-width: 550px; max-height: 95dvh; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 2px solid rgba(0, 242, 255, 0.2); }
    .modal-body { padding: 20px; overflow-y: auto; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255, 255, 255, 0.8); }
    .modal-input { width: 100%; padding: 12px; background: rgba(5, 5, 12, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-family: 'Orbitron', sans-serif; }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #050508; padding: 12px; border-radius: 8px; border: none; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; flex: 1; }
    
    /* ANALYSIS PANEL */
    #analysis-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); width: 95%; max-width: 1400px; height: 90dvh; background: rgba(10, 10, 20, 0.95); border: 2px solid rgba(0, 242, 255, 0.3); border-radius: 12px; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; }
    #analysis-panel.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
    .analysis-header { padding: 15px 20px; border-bottom: 2px solid rgba(0, 242, 255, 0.3); display: flex; justify-content: space-between; align-items: center;}
    .analysis-grid-wrapper { flex: 1; overflow: auto; padding: 15px; }
    .analysis-table { width: 100%; border-collapse: collapse; }
    .analysis-table th, .analysis-table td { border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px; text-align: center; font-size: 11px; }
    .analysis-table th { background: rgba(0, 242, 255, 0.1); color: var(--cyan); }
    .analysis-bullet { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-bottom: 4px; }
    .analysis-cell-clickable { cursor: pointer; transition: background 0.2s; }
    .analysis-cell-clickable:hover { background: rgba(255, 255, 255, 0.1); }

    /* SHARED MODAL FOR LISTS (BANK, MONTHS, DETAILS) */
    #list-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
    .list-modal-content { background: rgba(10, 10, 20, 0.95); border: 2px solid var(--cyan); border-radius: 16px; width: 100%; max-width: 700px; max-height: 90dvh; display: flex; flex-direction: column; }
    .list-modal-header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 2px solid rgba(0, 242, 255, 0.2); }
    .list-modal-body { padding: 20px; overflow-y: auto; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; gap: 10px; flex-wrap: wrap; }
    .list-item-info { flex: 1; min-width: 150px; }
    .list-item-desc { font-size: 14px; margin-bottom: 4px; }
    .list-item-date { font-size: 11px; color: #888; display: flex; align-items: center; gap: 6px; }
    .bank-tag { font-family: 'Orbitron'; font-size: 9px; padding: 2px 6px; border-radius: 4px; border: 1px solid; text-transform: uppercase; }
    .list-item-amount { font-family: 'Orbitron'; font-weight: bold; font-size: 15px; white-space: nowrap; }
    .list-item-actions { display: flex; gap: 6px; }

    .month-selector-btn { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; margin-bottom: 8px; cursor: pointer; border-left: 3px solid var(--purple); transition: all 0.2s; }
    .month-selector-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(3px); }

    /* ===========================================
       RESPONSIVE
       =========================================== */

    @media (max-width: 1200px) {
        .main-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; padding: 15px; gap: 15px; }
        .sidebar { height: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: visible; }
        .sidebar-buttons-container { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; flex: 1; overflow: visible; }
        .sidebar-btn { width: auto; padding: 10px 14px; margin: 0; flex: 1 1 auto; justify-content: center; font-size: 11px; }
        .sidebar-btn i { display: none; }
        .sidebar-btn span { text-align: center; }
        .btn-months { margin-top: 0; }
        .sidebar-widget { width: 100%; margin-top: 5px; padding: 10px; }
        .dashboard { height: auto; overflow: visible; }
        .transactions-section { max-height: none; min-height: 50vh; }
    }

    @media (max-width: 900px) {
        .dashboard-cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
        .main-header { height: 60px; }
        .main-layout { margin-top: 60px; padding: 10px; gap: 10px; }
        .dashboard-cards { grid-template-columns: 1fr; gap: 8px; }
        .stat-card { padding: 12px; }
        
        .transactions-table thead { display: none; }
        .transactions-table table { table-layout: auto; }
        .transactions-table tbody { display: flex; flex-direction: column; gap: 10px; }
        .transactions-table tr {
            display: grid; grid-template-columns: 1fr auto;
            grid-template-areas: "date amount" "desc desc" "actions actions";
            gap: 8px 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid transparent; border-radius: 10px; padding: 14px;
        }
        .transactions-table tr.income-row { border-left-color: var(--income-color); }
        .transactions-table tr.expense-row { border-left-color: var(--expense-color); }
        .transactions-table td { padding: 0; border: none; display: block; white-space: normal; }
        .transactions-table td:nth-child(1) { grid-area: date; font-size: 11px; color: rgba(255,255,255,0.6) !important; }
        .transactions-table td:nth-child(2) { grid-area: desc; font-size: 14px; font-weight: 500; word-break: break-word; }
        .transactions-table td:nth-child(3) { grid-area: amount; font-size: 16px; text-align: right; }
        .transactions-table td:nth-child(4) { grid-area: actions; justify-self: end; margin-top: 4px; }
        .transactions-table td:nth-child(4) .action-btn { width: 32px; height: 32px; font-size: 13px; }
    }

    @media (max-width: 480px) {
        .main-header { height: 55px; }
        .page-title { font-size: 20px; letter-spacing: 6px; }
        .main-layout { margin-top: 55px; padding: 8px; }
        .sidebar { padding: 10px; }
        .sidebar-btn { padding: 10px 8px; font-size: 10px; }
        .sidebar-widget { margin-top: 5px; padding: 8px; }
        .cyber-amount { font-size: 16px; }
        .transactions-table { padding: 8px; }
        .transactions-table td:nth-child(3) { font-size: 15px; }
        .list-item { flex-direction: column; align-items: flex-start; }
        .list-item-actions { align-self: flex-end; margin-top: 5px; }
    }
    </style>
</head>
<body>
    <svg style="display: none;">
        <defs>
            <symbol id="icon-eurobank" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="20" fill="#ffffff"/>
                <path d="M50 20 L25 70 H45 L55 50 L65 70 H85 L50 20 Z" fill="#ff2a2a"/>
            </symbol>
            <symbol id="icon-alpha" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="20" fill="#1a2b4c"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="6"/>
                <path d="M50 20 V80 M35 50 H65" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-nbg" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="20" fill="#ffffff"/>
                <ellipse cx="50" cy="50" rx="35" ry="20" fill="#00c3e3"/>
                <path d="M20 50 Q50 25 80 50 Q50 75 20 50 Z" fill="none" stroke="#007a8a" stroke-width="4"/>
                <path d="M35 40 V60 M50 35 V65 M65 40 V60" stroke="#007a8a" stroke-width="4" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-piraeus" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="20" fill="#ffcc00"/>
                <path d="M30 30 L45 70 H55 L40 30 Z" fill="#003366"/>
                <path d="M45 30 L60 70 H70 L55 30 Z" fill="#003366"/>
                <path d="M60 30 L75 70 H85 L70 30 Z" fill="#003366"/>
            </symbol>
        </defs>
    </svg>

    <div class="grid-bg"></div>

    <header class="main-header">
        <h1 class="page-title">
            <span class="letter-p">P</span>
            <span class="letter-a">A</span>
            <span class="letter-n">N</span>
            <span class="letter-e">E</span>
        </h1>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-buttons-container">
                <button class="sidebar-btn btn-analysis" id="btn-open-analysis">
                    <i class="fas fa-table"></i>
                    <span>ΑΝΑΛΥΣΗ</span>
                </button>
                <button class="sidebar-btn btn-transaction" id="btn-open-transaction">
                    <i class="fas fa-plus"></i>
                    <span>ΚΑΤΑΧΩΡΗΣΗ</span>
                </button>
                <button class="sidebar-btn btn-import" id="btn-import-data">
                    <i class="fas fa-upload"></i>
                    <span>ΕΙΣΑΓΩΓΗ</span>
                </button>
                <button class="sidebar-btn btn-export" id="btn-export-data">
                    <i class="fas fa-download"></i>
                    <span>ΕΞΑΓΩΓΗ</span>
                </button>
                <button class="sidebar-btn btn-months" id="btn-open-months">
                    <i class="fas fa-calendar-alt"></i>
                    <span>ΜΗΝΕΣ</span>
                </button>
            </div>
            <div class="sidebar-widget" id="sidebar-widget">
                <div class="widget-content">
                    <div class="widget-amount" id="total-amount">
                        <span class="cyber-amount">0,00 €</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="dashboard">
            <div class="dashboard-cards">
                <!-- PIRAEUS -->
                <div class="stat-card piraeus-card" onclick="openBankDetails('piraeus')">
                    <div class="card-accent piraeus-accent"></div>
                    <div class="card-icon"><svg><use href="#icon-piraeus"></use></svg></div>
                    <div class="card-content">
                        <h3 class="card-title">PIRAEUS</h3>
                        <p class="card-value" id="stat-piraeus">0.00 €</p>
                    </div>
                </div>
                <div class="stat-card alpha-card" onclick="openBankDetails('alpha')">
                    <div class="card-accent alpha-accent"></div>
                    <div class="card-icon"><svg><use href="#icon-alpha"></use></svg></div>
                    <div class="card-content">
                        <h3 class="card-title">ALPHA BANK</h3>
                        <p class="card-value" id="stat-alpha">0.00 €</p>
                    </div>
                </div>
                <div class="stat-card nbg-card" onclick="openBankDetails('nbg')">
                    <div class="card-accent nbg-accent"></div>
                    <div class="card-icon"><svg><use href="#icon-nbg"></use></svg></div>
                    <div class="card-content">
                        <h3 class="card-title">NBG</h3>
                        <p class="card-value" id="stat-nbg">0.00 €</p>
                    </div>
                </div>
                <div class="stat-card eurobank-card" onclick="openBankDetails('eurobank')">
                    <div class="card-accent eurobank-accent"></div>
                    <div class="card-icon"><svg><use href="#icon-eurobank"></use></svg></div>
                    <div class="card-content">
                        <h3 class="card-title">EUROBANK</h3>
                        <p class="card-value" id="stat-eurobank">0.00 €</p>
                    </div>
                </div>
            </div>

            <div class="transactions-section">
                <div class="transactions-header">
                    <h3>ΣΥΝΑΛΛΑΓΕΣ</h3>
                    <span class="transactions-count" style="font-size: 11px; opacity: 0.6; margin-left: 10px;">(10 τελευταίες)</span>
                </div>
                <div class="transactions-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ΗΜΕΡ/ΝΙΑ</th>
                                <th>ΠΕΡΙΓΡΑΦΗ</th>
                                <th>ΠΟΣΟ</th>
                                <th>ΕΝΕΡΓ.</th>
                            </tr>
                        </thead>
                        <tbody id="last-transactions"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- ANALYSIS PANEL -->
    <div id="analysis-panel">
        <div class="analysis-header">
            <h2 style="font-family: 'Orbitron'; color: var(--cyan);">ΑΝΑΛΥΣΗ</h2>
            <button id="btn-close-analysis" style="background: none; border: 1px solid #fff; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer;">ΚΛΕΙΣΙΜΟ</button>
        </div>
        <div class="analysis-grid-wrapper" id="analysis-grid"></div>
    </div>

    <!-- SHARED LIST MODAL (BANK, MONTHS, DETAILS) -->
    <div id="list-modal-overlay">
        <div class="list-modal-content">
            <div class="list-modal-header" id="list-modal-header">
                <h3 id="list-modal-title" style="color: var(--cyan); font-family: 'Orbitron';">ΛΙΣΤΑ</h3>
                <button id="btn-close-list-modal" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 18px;"><i class="fas fa-times"></i></button>
            </div>
            <div class="list-modal-body">
                <div id="list-modal-summary" style="margin-bottom: 15px; display: none; justify-content: space-between; align-items: center;">
                    <span style="font-family: 'Orbitron'; font-size: 12px; color: rgba(255,255,255,0.7);">ΣΥΝΟΛΟ</span>
                    <span id="list-modal-total" style="font-family: 'Orbitron'; font-size: 20px; font-weight: 900;">0.00 €</span>
                </div>
                <div id="list-modal-content"></div>
            </div>
        </div>
    </div>

    <!-- NEW TRANSACTION MODAL -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="color: var(--cyan); font-family: 'Orbitron';">ΝΕΑ ΚΑΤΑΧΩΡΗΣΗ</h3>
                <button id="btn-close-form" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 18px;"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>ΗΜΕΡΟΜΗΝΙΑ</label>
                    <input type="date" id="in-date" class="modal-input">
                </div>
                <div class="form-group">
                    <label>ΤΥΠΟΣ</label>
                    <select id="in-type" class="modal-input">
                        <option value="income">ΕΣΟΔΑ</option>
                        <option value="expense">ΕΞΟΔΑ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ΤΡΑΠΕΖΑ</label>
                    <select id="in-cat" class="modal-input">
                        <option value="piraeus">PIRAEUS</option>
                        <option value="alpha">ALPHA BANK</option>
                        <option value="nbg">NBG</option>
                        <option value="eurobank">EUROBANK</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ΠΟΣΟ (€)</label>
                    <input type="number" id="in-amount" step="0.01" placeholder="0.00" class="modal-input">
                </div>
                <div class="form-group">
                    <label>ΠΕΡΙΓΡΑΦΗ</label>
                    <input type="text" id="in-desc" placeholder="Περιγραφή..." class="modal-input">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-primary" id="btn-save-entry">ΑΠΟΘΗΚΕΥΣΗ</button>
                    <button class="btn-primary" id="btn-cancel-form" style="background: rgba(255,255,255,0.1); color: white;">ΑΚΥΡΩΣΗ</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <script>
    const MONTHS_GREEK = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
    const MONTHS_SHORT = ['ΙΑΝ', 'ΦΕΒ', 'ΜΑΡ', 'ΑΠΡ', 'ΜΑΙ', 'ΙΟΥΝ', 'ΙΟΥΛ', 'ΑΥΓ', 'ΣΕΠ', 'ΟΚΤ', 'ΝΟΕ', 'ΔΕΚ'];

    const CATEGORY_COLORS = { 'eurobank': '#ff2a2a', 'alpha': '#0055ff', 'nbg': '#00f2ff', 'piraeus': '#ffcc00' };
    const CATEGORY_NAMES = { 'eurobank': 'EUROBANK', 'alpha': 'ALPHA BANK', 'nbg': 'NBG', 'piraeus': 'PIRAEUS' };
    
    const INCOME_COLOR = '#00ff88';
    const EXPENSE_COLOR = '#ff4757';

    let db = JSON.parse(localStorage.getItem('pane_db_v2')) || [];

    function renderTransactionList(transactions, emptyMessage = "Δεν υπάρχουν συναλλαγές") {
        if (transactions.length === 0) {
            return `<p style="color: #666; text-align: center; padding: 20px;">${emptyMessage}</p>`;
        }
        
        let html = '';
        const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
        
        sorted.forEach(e => {
            const isIncome = e.type === 'income';
            const sign = isIncome ? '+' : '-';
            const bankColor = CATEGORY_COLORS[e.category]; 
            const bankName = CATEGORY_NAMES[e.category];
            const dateStr = new Date(e.date).toLocaleDateString('el-GR');
            const borderColor = isIncome ? INCOME_COLOR : EXPENSE_COLOR;

            html += `
                <div class="list-item" style="border-left-color: ${borderColor};">
                    <div class="list-item-info">
                        <div class="list-item-desc">${e.desc || '-'}</div>
                        <div class="list-item-date">
                            ${dateStr}
                            <span class="bank-tag" style="color: ${bankColor}; border-color: ${bankColor}66; text-shadow: 0 0 5px ${bankColor}66;">${bankName}</span>
                        </div>
                    </div>
                    <div class="list-item-amount" style="color: ${bankColor}; text-shadow: 0 0 6px ${bankColor}66;">
                        ${sign}${parseFloat(e.amount).toFixed(2)} €
                    </div>
                    <div class="list-item-actions">
                        <button class="action-btn edit-btn" onclick="editTransaction(${e.id})" title="Επεξεργασία"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete-btn" onclick="deleteTransaction(${e.id})" title="Διαγραφή"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        return html;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        document.getElementById('in-date').value = today.toISOString().split('T')[0];
        updateDashboard();
        setupEventListeners();
    });

    function updateDashboard() {
        let totals = { eurobank: 0, alpha: 0, nbg: 0, piraeus: 0 };
        db.forEach(entry => {
            const amt = parseFloat(entry.amount) * (entry.type === 'income' ? 1 : -1);
            totals[entry.category] += amt;
        });
        
        document.getElementById('stat-piraeus').textContent = `${totals.piraeus.toFixed(2)} €`;
        document.getElementById('stat-alpha').textContent = `${totals.alpha.toFixed(2)} €`;
        document.getElementById('stat-nbg').textContent = `${totals.nbg.toFixed(2)} €`;
        document.getElementById('stat-eurobank').textContent = `${totals.eurobank.toFixed(2)} €`;
        
        const total = totals.eurobank + totals.alpha + totals.nbg + totals.piraeus;
        document.querySelector('.cyber-amount').textContent = `${total.toFixed(2)} €`;

        renderLastTransactions();
    }

    function renderLastTransactions() {
        const container = document.getElementById('last-transactions');
        if (db.length === 0) {
            container.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px; color: #666;">Δεν υπάρχουν καταχωρήσεις</td></tr>`;
            return;
        }

        const lastTransactions = [...db].sort((a, b) => b.id - a.id).slice(0, 10);
        let html = '';

        lastTransactions.forEach(entry => {
            const isIncome = entry.type === 'income';
            const sign = isIncome ? '+' : '-';
            const bankColor = CATEGORY_COLORS[entry.category];
            const dateStr = new Date(entry.date).toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: '2-digit' });

            html += `
                <tr class="${isIncome ? 'income-row' : 'expense-row'}">
                    <td>${dateStr}</td>
                    <td>${entry.desc || '-'}</td>
                    <td style="color: ${bankColor}; font-family: 'Orbitron', sans-serif; font-weight: bold;">
                        ${sign}${parseFloat(entry.amount).toFixed(2)} €
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit-btn" onclick="editTransaction(${entry.id})"><i class="fas fa-edit"></i></button>
                            <button class="action-btn delete-btn" onclick="deleteTransaction(${entry.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        });
        container.innerHTML = html;
    }

    function showAnalysis() {
        document.getElementById('analysis-panel').classList.add('active');
        const grid = document.getElementById('analysis-grid');
        
        let html = `<table class="analysis-table"><thead><tr><th>ΜΗΝΑΣ</th>
            <th>PIRAEUS</th><th>ALPHA</th><th>NBG</th><th>EUROBANK</th>
        </tr></thead><tbody>`;

        const currentYear = new Date().getFullYear();
        
        for (let m = 0; m < 12; m++) {
            html += `<tr><td style="color: #9d00ff; font-weight: bold;">${MONTHS_SHORT[m]}</td>`;
            ['piraeus', 'alpha', 'nbg', 'eurobank'].forEach(cat => {
                const data = db.filter(e => {
                    const d = new Date(e.date);
                    return d.getFullYear() === currentYear && d.getMonth() === m && e.category === cat;
                });
                const count = data.length;
                
                const bulletColor = CATEGORY_COLORS[cat];
                if (count > 0) {
                    html += `<td class="analysis-cell-clickable" onclick="openAnalysisCellDetails(${m}, '${cat}')">
                        <div class="analysis-bullet" style="background: ${bulletColor}; box-shadow: 0 0 8px ${bulletColor};"></div>
                        <span style="font-size: 9px; display: block; color: #aaa;">${count}</span>
                    </td>`;
                } else {
                    html += `<td>-</td>`;
                }
            });
            html += `</tr>`;
        }
        html += `</tbody></table>`;
        grid.innerHTML = html;
    }

    function openAnalysisCellDetails(monthIndex, category) {
        const currentYear = new Date().getFullYear();
        const data = db.filter(e => {
            const d = new Date(e.date);
            return d.getFullYear() === currentYear && d.getMonth() === monthIndex && e.category === category;
        });

        const title = `${MONTHS_GREEK[monthIndex]} - ${CATEGORY_NAMES[category]}`;
        openListModal(title, data, CATEGORY_COLORS[category]);
    }

    function openBankDetails(category) {
        const data = db.filter(e => e.category === category);
        const title = CATEGORY_NAMES[category];
        openListModal(title, data, CATEGORY_COLORS[category]);
    }

    function showMonths() {
        const currentYear = new Date().getFullYear();
        let html = '';
        
        for (let m = 0; m < 12; m++) {
            let monthTotal = 0;
            db.forEach(e => {
                const d = new Date(e.date);
                if (d.getFullYear() === currentYear && d.getMonth() === m) {
                    monthTotal += parseFloat(e.amount) * (e.type === 'income' ? 1 : -1);
                }
            });
            
            const color = monthTotal >= 0 ? INCOME_COLOR : EXPENSE_COLOR;
            const sign = monthTotal >= 0 ? '+' : '';

            html += `
                <div class="month-selector-btn" onclick="openMonthDetails(${m})">
                    <span style="font-family: 'Orbitron'; font-size: 12px;">${MONTHS_GREEK[m].toUpperCase()}</span>
                    <span style="font-family: 'Orbitron'; font-weight: bold; color: ${color};">${sign}${monthTotal.toFixed(2)} €</span>
                </div>
            `;
        }
        
        document.getElementById('list-modal-title').textContent = "ΕΠΙΛΟΓΗ ΜΗΝΑ";
        document.getElementById('list-modal-title').style.color = "var(--purple)";
        document.getElementById('list-modal-summary').style.display = 'none';
        document.getElementById('list-modal-content').innerHTML = html;
        document.getElementById('list-modal-overlay').style.display = 'flex';
    }

    function openMonthDetails(monthIndex) {
        const currentYear = new Date().getFullYear();
        const data = db.filter(e => {
            const d = new Date(e.date);
            return d.getFullYear() === currentYear && d.getMonth() === monthIndex;
        });

        const title = `${MONTHS_GREEK[monthIndex]} ${currentYear}`;
        openListModal(title, data);
    }

    function openListModal(title, data, color = null) {
        document.getElementById('list-modal-title').textContent = title;
        document.getElementById('list-modal-title').style.color = color || "var(--cyan)";
        
        let total = 0;
        data.forEach(e => {
            total += parseFloat(e.amount) * (e.type === 'income' ? 1 : -1);
        });

        const summaryEl = document.getElementById('list-modal-summary');
        const totalEl = document.getElementById('list-modal-total');
        
        summaryEl.style.display = 'flex';
        totalEl.textContent = `${total.toFixed(2)} €`;
        totalEl.style.color = color || (total >= 0 ? INCOME_COLOR : EXPENSE_COLOR);
        
        document.getElementById('list-modal-content').innerHTML = renderTransactionList(data);
        document.getElementById('list-modal-overlay').style.display = 'flex';
    }

    function setupEventListeners() {
        document.getElementById('btn-open-analysis').onclick = showAnalysis;
        document.getElementById('btn-close-analysis').onclick = () => document.getElementById('analysis-panel').classList.remove('active');
        
        document.getElementById('btn-open-transaction').onclick = () => {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('in-amount').value = '';
            document.getElementById('in-desc').value = '';
            document.getElementById('in-cat').value = 'piraeus';
        };
        
        document.getElementById('btn-close-list-modal').onclick = () => document.getElementById('list-modal-overlay').style.display = 'none';
        
        document.getElementById('btn-close-form').onclick = closeModal;
        document.getElementById('btn-cancel-form').onclick = closeModal;
        document.getElementById('btn-save-entry').onclick = saveEntry;
        
        document.getElementById('btn-export-data').onclick = exportData;
        document.getElementById('btn-import-data').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('btn-open-months').onclick = showMonths;
        
        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    const existingIds = new Set(db.map(i => i.id));
                    const newEntries = imported.filter(i => !existingIds.has(i.id));
                    db.push(...newEntries);
                    localStorage.setItem('pane_db_v2', JSON.stringify(db));
                    updateDashboard();
                    alert(`${newEntries.length} νέες καταχωρήσεις!`);
                } catch (err) { alert('Σφάλμα αρχείου'); }
            };
            reader.readAsText(file);
        };
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function saveEntry() {
        const entry = {
            id: Date.now(),
            date: document.getElementById('in-date').value,
            type: document.getElementById('in-type').value,
            category: document.getElementById('in-cat').value,
            amount: parseFloat(document.getElementById('in-amount').value) || 0,
            desc: document.getElementById('in-desc').value.trim()
        };

        if (entry.amount <= 0) return alert('Εισάγετε έγκυρο ποσό.');

        db.push(entry);
        localStorage.setItem('pane_db_v2', JSON.stringify(db));
        updateDashboard();
        closeModal();
    }

    function deleteTransaction(id) {
        if (!confirm('Διαγραφή συναλλαγής;')) return;
        db = db.filter(entry => entry.id !== id);
        localStorage.setItem('pane_db_v2', JSON.stringify(db));
        updateDashboard();
        document.getElementById('list-modal-overlay').style.display = 'none'; 
    }
    
    function editTransaction(id) {
        alert("Η επεξεργασία θα ανοίξει εδώ.");
    }
    
    // Εδώ είναι η αλλαγή για την ημερομηνία στο αρχείο εξαγωγής
    function exportData() {
        const today = new Date();
        const dateStr = today.toISOString().split('T')[0]; // Παίρνει τη μορφή YYYY-MM-DD
        
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `pane_data_${dateStr}.json`; // Εδώ μπαίνει η ημερομηνία
        a.click();
    }
    </script>
</body>
</html>
